  # Audio (Phase 2+)
  audioplayers: ^6.0.0
  record: ^5.1.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.0.2+1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.7
  mockito: ^5.4.4

flutter:
  uses-material-design: true

